version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: outreach_redis_cache
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: outreach_engine_api
    restart: always
    ports:
      - "8000:8000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - redis
    volumes:
      - ./backend/outreach_cache.db:/app/backend/outreach_cache.db

volumes:
  redis_data:
